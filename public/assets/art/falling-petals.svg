<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220" fill="none">
  <!-- Delicate falling cherry blossom petals near branch (soft pinks, varied rotation, low opacity) -->
  <defs>
    <g id="sakura-petal">
      <path d="M 0 -10 C 5 -10, 8 -3, 6 5 C 4 10, 1 11, 0 9 C -1 11, -4 10, -6 5 C -8 -3, -5 -10, 0 -10 Z" />
    </g>
  </defs>

  <g opacity="0.65">
    <!-- Petal 1: drifting upper-right -->
    <use href="#sakura-petal" x="320" y="45" transform="rotate(25 320 45) scale(1.1)" fill="#F48FB1" opacity="0.55" />

    <!-- Petal 2: drifting near sun edge -->
    <use href="#sakura-petal" x="220" y="70" transform="rotate(-35 220 70) scale(0.9)" fill="#E57373" opacity="0.45" />

    <!-- Petal 3: floating near branch mid -->
    <use href="#sakura-petal" x="280" y="115" transform="rotate(15 280 115) scale(1.0)" fill="#F06292" opacity="0.5" />

    <!-- Petal 4: small fluttering petal -->
    <use href="#sakura-petal" x="180" y="145" transform="rotate(50 180 145) scale(0.75)" fill="#EF5350" opacity="0.4" />

    <!-- Petal 5: gentle breeze near bottom of branch -->
    <use href="#sakura-petal" x="250" y="175" transform="rotate(-20 250 175) scale(0.85)" fill="#F48FB1" opacity="0.45" />
  </g>
</svg>
