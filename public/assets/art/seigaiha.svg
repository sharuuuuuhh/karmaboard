<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
  <defs>
    <style>
      .arc { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>
  <!-- Center circle at (60, 60) -->
  <circle cx="60" cy="60" r="10" class="arc" />
  <circle cx="60" cy="60" r="20" class="arc" />
  <circle cx="60" cy="60" r="30" class="arc" />
  <circle cx="60" cy="60" r="40" class="arc" />
  <circle cx="60" cy="60" r="50" class="arc" />
  <circle cx="60" cy="60" r="60" class="arc" />

  <!-- Top left circle at (0, 0) -->
  <circle cx="0" cy="0" r="10" class="arc" />
  <circle cx="0" cy="0" r="20" class="arc" />
  <circle cx="0" cy="0" r="30" class="arc" />
  <circle cx="0" cy="0" r="40" class="arc" />
  <circle cx="0" cy="0" r="50" class="arc" />
  <circle cx="0" cy="0" r="60" class="arc" />

  <!-- Top right circle at (120, 0) -->
  <circle cx="120" cy="0" r="10" class="arc" />
  <circle cx="120" cy="0" r="20" class="arc" />
  <circle cx="120" cy="0" r="30" class="arc" />
  <circle cx="120" cy="0" r="40" class="arc" />
  <circle cx="120" cy="0" r="50" class="arc" />
  <circle cx="120" cy="0" r="60" class="arc" />

  <!-- Bottom left circle at (0, 60) -->
  <circle cx="0" cy="60" r="10" class="arc" />
  <circle cx="0" cy="60" r="20" class="arc" />
  <circle cx="0" cy="60" r="30" class="arc" />
  <circle cx="0" cy="60" r="40" class="arc" />
  <circle cx="0" cy="60" r="50" class="arc" />
  <circle cx="0" cy="60" r="60" class="arc" />

  <!-- Bottom right circle at (120, 60) -->
  <circle cx="120" cy="60" r="10" class="arc" />
  <circle cx="120" cy="60" r="20" class="arc" />
  <circle cx="120" cy="60" r="30" class="arc" />
  <circle cx="120" cy="60" r="40" class="arc" />
  <circle cx="120" cy="60" r="50" class="arc" />
  <circle cx="120" cy="60" r="60" class="arc" />
</svg>
