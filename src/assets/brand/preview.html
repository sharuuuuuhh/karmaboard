<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Karmayodha Mark Preview</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }
    .row {
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .box {
      border: 1px dashed #444;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .box-light {
      background: #fff;
      color: #111;
    }
    img.orig {
      max-width: 250px;
    }
  </style>
</head>
<body>
  <h2>Traced Mark Comparison</h2>
  <div>
    <h4>Original Source</h4>
    <img class="orig" src="logo-source.png" />
  </div>

  <h3>Dark Background (color: white)</h3>
  <div class="row">
    <div>
      <div>24px</div>
      <div class="box" style="width: 24px; height: 24px; color: #fff;">
        <img src="karmayodha-mark-traced.svg" width="24" height="24" />
      </div>
    </div>
    <div>
      <div>48px</div>
      <div class="box" style="width: 48px; height: 48px; color: #fff;">
        <img src="karmayodha-mark-traced.svg" width="48" height="48" />
      </div>
    </div>
    <div>
      <div>256px</div>
      <div class="box" style="width: 256px; height: 256px; color: #fff;">
        <img src="karmayodha-mark-traced.svg" width="256" height="256" />
      </div>
    </div>
  </div>

  <h3>Light Background (color: dark)</h3>
  <div class="row">
    <div>
      <div>24px</div>
      <div class="box box-light" style="width: 24px; height: 24px;">
        <img src="karmayodha-mark-traced.svg" width="24" height="24" style="filter: invert(1);" />
      </div>
    </div>
    <div>
      <div>48px</div>
      <div class="box box-light" style="width: 48px; height: 48px;">
        <img src="karmayodha-mark-traced.svg" width="48" height="48" style="filter: invert(1);" />
      </div>
    </div>
    <div>
      <div>256px</div>
      <div class="box box-light" style="width: 256px; height: 256px;">
        <img src="karmayodha-mark-traced.svg" width="256" height="256" style="filter: invert(1);" />
      </div>
    </div>
  </div>
</body>
</html>
